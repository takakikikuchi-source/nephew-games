<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>しんかんせん うんてんし</title>
<style>
:root{--bg:#0d2a4a;--panel:#123b66;--panel2:#1b4d82;--ink:#fff;--sub:#bcd4ef;--accent:#ffd43b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","BIZ UDGothic","Yu Gothic UI","Meiryo",sans-serif;overflow:hidden;user-select:none}
button{font-family:inherit;cursor:pointer}
rt{font-size:.5em}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.btn{font-size:22px;font-weight:700;padding:12px 26px;border-radius:16px;border:none;background:#fff;color:#123b66;box-shadow:0 5px 0 #9fb7d1}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #9fb7d1}
.btn.primary{background:var(--accent);color:#3b2a00;box-shadow:0 5px 0 #c49a00}
.btn.big{font-size:32px;padding:18px 56px}
.dlg .btn{background:#e7f0fb}
.dlg .btn.primary{background:var(--accent)}
.dlg .dlg-body{color:#222}
kbd{display:inline-block;min-width:1.7em;text-align:center;padding:1px 6px;border-radius:6px;background:#f1f3f5;color:#212529;border:1px solid #adb5bd;border-bottom-width:3px;font-family:inherit;font-weight:700}

#s-title,#s-profile{align-items:center;justify-content:center;gap:26px;background:linear-gradient(#4dabf7,#1c7ed6 55%,#0d2a4a);overflow:auto}
.title-train{font-size:120px;animation:dash 2.5s ease-in-out infinite}
.logo{margin:0;font-size:clamp(46px,7vw,84px);text-align:center;line-height:1.15;color:#fff;text-shadow:0 6px 0 #0b3d70,0 0 30px rgba(255,255,255,.4)}

.topbar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:3px solid #0b2c50;flex-wrap:wrap}
.topbar .who{font-size:20px;font-weight:700}
.topbar .chip{background:var(--panel2);border-radius:999px;padding:6px 14px;font-size:18px;font-weight:700}
.topbar .spacer{flex:1}
.topbar .tb{font-size:17px;padding:8px 14px;border-radius:12px;border:none;background:var(--panel2);color:#fff;font-weight:700}
.page{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px;align-items:center}
.page h2{margin:0;font-size:32px}
.hint{color:var(--sub);font-size:17px}

.modes{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.modecard{width:min(300px,85vw);display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px;border-radius:26px;border:none;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.modecard.easy{background:linear-gradient(#69db7c,#2f9e44)}
.modecard.normal{background:linear-gradient(#4dabf7,#1864ab)}
.modecard.hard{background:linear-gradient(#ff8787,#c92a2a)}
.mic{font-size:80px;line-height:1}
.mname{font-size:34px;font-weight:700}
.mdesc{font-size:17px;line-height:1.7}
.keyhelp{background:rgba(255,255,255,.1);border-radius:18px;padding:14px 20px;display:flex;flex-direction:column;gap:8px;font-size:18px}

.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;width:min(1200px,96vw)}
.course{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border-radius:20px;border:none;background:#fff;color:#123b66;text-align:left;box-shadow:0 5px 0 #9fb7d1}
.ttype{color:#fff;font-weight:700;padding:4px 12px;border-radius:999px;font-size:17px}
.cname{font-size:24px;font-weight:700}
.cinfo{font-size:15px;color:#4a6584}
.cnote{font-size:15px;color:#d9480f;font-weight:700}
.cbest{font-size:18px;color:#f08c00}

.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;width:min(1100px,96vw)}
.stamp{aspect-ratio:1;border-radius:50%;border:5px dashed #5c7ea3;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.06)}
.stamp.got{border:6px solid var(--sc);background:#fff;color:var(--sc);transform:rotate(-6deg)}
.sic{font-size:52px}
.snm{font-size:18px;font-weight:700}
.skj{font-size:14px}

/* ===== ゲーム画面 ===== */
#s-game{background:#000;--deskH:clamp(230px,38vh,300px)}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
/* 運転席の窓わく */
.cab{position:absolute;left:0;right:0;top:0;bottom:var(--deskH);pointer-events:none;
  background:
   linear-gradient(180deg,#232a33 0 3.5%,transparent 3.5%),
   linear-gradient(90deg,#232a33 0 3%,transparent 3% 97%,#232a33 97%),
   radial-gradient(ellipse 120% 140% at 50% 0%,transparent 70%,rgba(20,25,32,.85) 71%)}
.hud-tl{position:absolute;left:4%;top:6%;background:rgba(10,25,45,.72);padding:10px 14px;border-radius:14px;font-size:15px;line-height:1.8;max-height:42vh;overflow:hidden}
.hud-tl:empty{display:none}
.hud-tl .done{opacity:.45}
.hud-tl .cur{color:var(--accent);font-weight:700}
.ffbadge{position:absolute;right:120px;top:50px;background:rgba(20,40,80,.85);color:#fff;font-size:22px;font-weight:900;padding:6px 16px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:4}
.ffbadge.on{opacity:1;animation:ffblink 1s ease-in-out infinite}
@keyframes ffblink{50%{opacity:.6}}
.guide{position:absolute;left:50%;top:9%;transform:translate(-50%,-20px);opacity:0;transition:.25s;background:rgba(255,255,255,.95);color:#123b66;
  font-size:clamp(22px,3vw,38px);font-weight:900;padding:14px 30px;border-radius:20px;box-shadow:0 6px 0 rgba(0,0,0,.25);pointer-events:none;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
.guide.on{opacity:1;transform:translate(-50%,0)}
.resultpop{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%) scale(.6);opacity:0;transition:.3s cubic-bezier(.3,1.6,.6,1);background:#fff;color:#123b66;
  border-radius:28px;padding:20px 44px;text-align:center;font-size:26px;font-weight:700;pointer-events:none;box-shadow:0 10px 0 rgba(0,0,0,.3)}
.resultpop.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.plabel{font-size:52px;color:#e8590c}
.pstars{font-size:48px}
.pausebtn{position:absolute;right:4%;top:6%;font-size:26px;width:54px;height:54px;border-radius:14px;border:none;background:rgba(10,25,45,.72);color:#fff}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px;background:#0d2a4a}

/* 運転台 */
.desk{position:absolute;left:0;right:0;bottom:0;height:var(--deskH);display:grid;
  grid-template-columns:118px minmax(0,1fr) auto minmax(0,1fr) 118px;grid-template-rows:minmax(0,1fr);gap:12px;padding:12px 14px;
  background:linear-gradient(#4a5563,#2a313b 18%,#1c2129);border-top:6px solid #6b7684;box-shadow:inset 0 3px 0 #8b96a3}
.lw{display:flex;flex-direction:column;gap:6px;min-height:0}
.lt{text-align:center;font-weight:900;font-size:17px;color:#fff;letter-spacing:.06em}
.lever{position:relative;touch-action:none;flex:1;min-height:0;display:flex;flex-direction:column;gap:2px;padding-right:46px;background:#141920;border-radius:12px;padding-top:4px;padding-bottom:4px;padding-left:4px;border:2px solid #3b4654}
.lever .slot{position:absolute;right:20px;top:8px;bottom:8px;width:8px;border-radius:4px;background:#05070a;box-shadow:inset 0 0 3px #000}
.lever .handle{position:absolute;right:4px;width:40px;height:16px;margin-top:-8px;border-radius:8px;transition:top .12s ease-out;
  background:linear-gradient(#5c6672,#2c333c);box-shadow:0 3px 4px rgba(0,0,0,.6);pointer-events:none}
.lever .handle span{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f1f3f5,#868e96 60%,#495057)}
.nl{flex:1;min-height:0;font-size:13px;line-height:1;font-weight:700;border:none;border-radius:5px;padding:0 4px;color:#c3ccd6;background:#232b35;text-align:left}
.lever.power .nl.on{background:#4dabf7;color:#04213d;box-shadow:0 0 8px #4dabf7}
.lever.brake .nl.on{background:#ffa94d;color:#3b1d00;box-shadow:0 0 8px #ffa94d}
.lever.brake .nl.eb.on{background:#ff6b6b;color:#fff}
.nl.eb{color:#ff8787}
.kh{font-size:14px;color:#dbe4ee;text-align:center;line-height:1.55;flex:none}
.lw .lt{flex:none}
.mon{background:#06121f;border:5px solid #2f3b4a;border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;justify-content:center;min-width:0;
  color:#c9f2ff;box-shadow:inset 0 0 18px rgba(77,171,247,.15)}
.mrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ml{font-size:16px;color:#7fb2d6}
.mon b#nextname{font-size:clamp(26px,3.2vw,40px);color:#fff}
.dside{font-size:16px;color:var(--accent)}
.dist{font-size:clamp(20px,2.3vw,28px);font-weight:700;color:#d0ebff}
.meter{opacity:0;transition:.3s}
.meter.on{opacity:1}
.mtrack{position:relative;height:38px;background:#0b1a2b;border-radius:999px;border:2px solid #2f4a66}
.mtrain{position:absolute;top:1px;font-size:26px;transform:scaleX(-1);transition:left .1s linear}
.mflag{position:absolute;right:6px;top:1px;font-size:26px}
.clock{font-size:16px;color:#9fc6e6}
.gauge{position:relative;height:100%;aspect-ratio:1}
.gsvg{width:100%;height:100%}
.atclamp{fill:#2b333d}
.atclamp.on{fill:#ffa94d;filter:drop-shadow(0 0 4px #ffa94d)}
.atcbox{position:absolute;right:-4px;top:-2px;background:#0a0f16;border:3px solid #ff922b;border-radius:10px;padding:2px 8px;display:flex;flex-direction:column;align-items:center;z-index:2}
.atcbox span{font-size:12px;color:#ff922b;font-weight:700}
.atcbox b{font-size:24px;color:#ffd8a8}
.atcbox.flash{animation:atcflash .3s steps(2) 4}
.atcbox.warn{background:#c92a2a;animation:blink .4s steps(2) infinite}
.mon.right{align-items:stretch}
.lamps{display:flex;gap:8px;flex-wrap:wrap}
.lamp{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:#1f2a36;color:#6c7f93;border:1px solid #33475c}
.lamp.on{background:#51cf66;color:#0b2e13;border-color:#8ce99a}
.lamp.warn{background:#fa5252;color:#fff;animation:blink .4s steps(2) infinite}
.notchinfo{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;color:#9fc6e6}
.notchinfo b{font-size:20px;color:#fff}
.sbtns{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{display:flex;align-items:center;gap:6px;font-size:20px;padding:6px 12px;border-radius:12px;border:none;background:#e7f0fb;color:#123b66;font-weight:700}
.sbtn span{font-size:14px}
.sbtn.blink{animation:glow .8s ease-in-out infinite}

.board{position:absolute;left:50%;bottom:calc(var(--deskH) + 14px);transform:translateX(-50%);background:rgba(255,255,255,.95);color:#123b66;border-radius:22px;padding:16px 22px;display:none;flex-direction:column;align-items:center;gap:10px;width:min(620px,90vw)}
.board.on{display:flex}
.btrain{width:100%;height:56px;background:linear-gradient(#fff 0 62%,#1c4fa3 62% 72%,#fff 72% 80%,#1c4fa3 80% 84%,#fff 84%);border:3px solid #adb5bd;border-radius:14px 40px 14px 14px;display:flex;justify-content:space-around;align-items:flex-end}
.bdoor{width:22px;height:42px;background:#dee2e6;border:2px solid #868e96;border-bottom:none}
.bpeople{font-size:28px;white-space:nowrap;overflow:hidden;width:100%;animation:walk 4.5s linear forwards}
.btext{font-size:22px;font-weight:700}

.bigstars{font-size:72px}
.score{font-size:28px;font-weight:700}
.tablewrap{max-width:100%;overflow-x:auto}
.rtable{border-collapse:collapse;background:#fff;color:#123b66;border-radius:14px;overflow:hidden;font-size:18px}
.rtable th,.rtable td{padding:8px 14px;border-bottom:1px solid #dee2e6;text-align:center}
.rtable th{background:#d0ebff}
.rank{font-size:22px;font-weight:700;color:var(--accent)}

@keyframes blink{50%{opacity:.4}}
@keyframes atcflash{50%{background:#ff922b}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,212,59,0)}50%{box-shadow:0 0 0 6px rgba(255,212,59,.95);background:#fff3bf}}
@keyframes walk{from{transform:translateX(-30%)}to{transform:translateX(10%)}}
@keyframes dash{0%,100%{transform:translateX(-20px)}50%{transform:translateX(20px)}}
@media (max-width:980px){.desk{grid-template-columns:100px minmax(0,1fr) auto 100px}.mon.right{display:none}.hud-tl{display:none}}
@media (prefers-reduced-motion:reduce){.title-train,.bpeople{animation:none}}

/* ===== スマホの よこむき（たかさ 520px いか） ===== */
@media (pointer:coarse){.kh{display:none}}
@media (max-height:520px){
  #s-game{--deskH:46vh}
  .desk{grid-template-columns:78px minmax(0,1.2fr) auto minmax(0,1fr) 78px;gap:6px;padding:5px 8px;border-top-width:3px}
  .mon.right{display:flex}
  .lt{font-size:12px}
  .lw{gap:3px}
  .lever{padding-right:30px;border-radius:8px}
  .lever .slot{right:13px}
  .lever .handle{width:28px;height:12px;margin-top:-6px}
  .lever .handle span{width:16px;height:16px;margin:-8px 0 0 -8px}
  .nl{font-size:10px;border-radius:3px}
  .mon{padding:4px 8px;gap:2px;border-width:3px;border-radius:8px}
  .ml,.dside,.clock{font-size:11px}
  .mon b#nextname{font-size:20px}
  .dist{font-size:15px}
  .mtrack{height:22px}
  .mtrain,.mflag{font-size:16px}
  .lamps,.notchinfo{display:none}
  .sbtns{flex-direction:column;gap:4px}
  .sbtn{font-size:14px;padding:3px 8px;border-radius:8px;justify-content:center}
  .sbtn span{font-size:12px}
  .atcbox{padding:0 5px;border-width:2px}
  .atcbox span{font-size:9px}
  .atcbox b{font-size:15px}
  .guide{font-size:16px;padding:6px 14px;border-radius:12px;top:5%}
  .pausebtn{width:38px;height:38px;font-size:18px;border-radius:10px;top:4%}
  .ffbadge{right:60px;top:12px;font-size:14px;padding:3px 10px}
  .resultpop{font-size:16px;padding:10px 22px}
  .plabel{font-size:30px}.pstars{font-size:28px}
  .board{padding:6px 12px;gap:4px;width:min(460px,80vw)}
  .btrain{height:32px}.bdoor{width:14px;height:24px}
  .bpeople{font-size:18px}.btext{font-size:15px}
  .page{padding:10px;gap:8px}
  .page h2{margin:0;font-size:20px}
  .topbar{padding:4px 10px;gap:8px}
  .topbar .who{font-size:15px}.topbar .chip{font-size:13px;padding:3px 10px}.topbar .tb{font-size:13px;padding:5px 10px}
  .btn{font-size:16px;padding:8px 16px}
  .modecard{width:min(240px,40vw);padding:10px;gap:4px;border-radius:18px}
  .mic{font-size:40px}.mname{font-size:22px}.mdesc{font-size:12px;line-height:1.5}
  .keyhelp{display:none}
  .courses{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
  .course{padding:8px 10px;gap:2px;border-radius:14px}
  .bigstars{font-size:40px}.score{font-size:18px}.rank{font-size:15px}
  .rtable{font-size:13px}.rtable th,.rtable td{padding:3px 8px}
}
</style>
</head>
<body>
<div id="app">
  <section id="s-title" class="screen on"></section>
  <section id="s-profile" class="screen"></section>
  <section id="s-mode" class="screen"></section>
  <section id="s-course" class="screen"></section>
  <section id="s-stamps" class="screen"></section>
  <section id="s-game" class="screen"></section>
  <section id="s-result" class="screen"></section>
</div>
<!--APP-->
</body>
</html>
