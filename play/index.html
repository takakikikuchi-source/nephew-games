<title>ゲームメニュー</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"BIZ UDPGothic","Meiryo",sans-serif;background:linear-gradient(#bde0fe,#e0f2fe);color:#1b2a41}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;padding:24px}
h1{margin:0;font-size:clamp(32px,5vw,52px)}
.row{display:flex;gap:28px;flex-wrap:wrap;justify-content:center}
a.game{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(320px,80vw);padding:28px;border-radius:28px;
  text-decoration:none;color:#fff;font-size:30px;font-weight:700;box-shadow:0 10px 0 rgba(0,0,0,.2);transition:transform .1s}
a.game:hover{transform:translateY(-4px)}
a.game span{font-size:96px;line-height:1}
.venom{background:linear-gradient(#5f3dc4,#2b1a6b)}
.shin{background:linear-gradient(#1c7ed6,#0b4a8b)}
</style>
</head>
<body>
<main>
  <h1>どれで あそぶ？</h1>
  <div class="row">
    <a class="game venom" href="venom.html"><span>🦂</span>ベノムモンスター</a>
    <a class="game shin" href="shinkansen.html"><span>🚄</span>しんかんせん<br>うんてんし</a>
  </div>
</main>
